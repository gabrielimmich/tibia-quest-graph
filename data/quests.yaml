# Fonte única da verdade do grafo. Ver CLAUDE.md, seção 4.
#
# Regra de ouro: nenhuma aresta entra sem `evidence` copiada literalmente da
# página da TibiaWiki (texto como aparece renderizado), e `source` é a URL de
# onde o trecho foi copiado. `npm run validate` recusa placeholder, id
# inexistente, ciclo e campo desconhecido.
#
# Direção: `from` é a quest exigida, `to` é a quest que exige.
# Comentários "fase 2" registram pré-requisitos citados pela wiki que apontam
# para quests fora das 15 do MVP; viram arestas quando essas quests entrarem.
#
# As 15 quests do MVP e suas 14 arestas foram aprovadas por Gabriel em 2026-09-12.
# O resto entra por `npm run collect` (scripts/collect.ts): arestas com
# `reviewed: false` ainda não foram conferidas; as com comentário `revisar`
# tiveram tipo ou direção lidos automaticamente. Fila em docs/superpowers/review/.

quests:
  - id: the-new-frontier
    title: The New Frontier Quest
    level: 77 # wiki: "77*(for the last mission only)"
    premium: true
    wiki: https://tibia.fandom.com/wiki/The_New_Frontier_Quest
    unlocks: "Acesso ao sul e centro de Zao e Warmaster Outfit"
    reward: Tome of Knowledge, Piggy Bank, 2 Gold Ingots, Bullseye Potion, Mastermind Potion and Berserk Potion, access to the southern and central parts of Zao, base Warmaster Outfit
    location: Farmine
    region: Zao

  - id: children-of-the-revolution
    title: Children of the Revolution Quest
    premium: true
    wiki: https://tibia.fandom.com/wiki/Children_of_the_Revolution_Quest
    unlocks: "Serpent Crest (addon Warmaster) e tasks diárias e semanais em Zao"
    reward: 10,000 Experience, Tome of Knowledge, Serpent Crest - 2nd addon for Warmaster Outfits, ability to start various tasks.
    location: Zao
    region: Zao

  - id: wrath-of-the-emperor
    title: Wrath of the Emperor Quest
    level: 80 # wiki: "80 (Expertise door during mission 8)"
    premium: true
    wiki: https://tibia.fandom.com/wiki/Wrath_of_the_Emperor_Quest
    unlocks: "Acesso e teleportes para Razachai, Rebel Camp e Inner Sanctum; Wayfarer Outfit"
    reward: Spiritual Charm, Black Jade Cobra, 100 Platinum Coins, 10 Crystal Coins, 10 Red Dragon Scales, 5 Gold Ingots, 10 Black Pearls, Blue Gem, Dragon Backpack, Jewelled Backpack. Choose between Elite Draken Helmet, Royal Draken Mail, Royal Scale Robe or Merudri Scale Mail…
    location: Primarily Zao including the Zao Rebel Camp
    region: Zao
    # fase 2: "The Ape City Quest (full quest not needed - mission 9 started)"

  - id: in-service-of-yalahar
