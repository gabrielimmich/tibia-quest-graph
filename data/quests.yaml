    reward: Passage into the innermost area and through the gates to the city quarters; 5 Platinum Coins, choice between Yalahari Mask, Yalahari Armor, Yalahari Leg Piece and Yalahari Footwraps and base Yalaharian Outfits.
    location: Edron
    region: Edron
    # fase 2: "Novice Rank or higher of the Tibian Explorer Society"

  - id: the-inquisition
    title: The Inquisition Quest
    level: 100
    premium: true
    wiki: https://tibia.fandom.com/wiki/The_Inquisition_Quest
    unlocks: "Demon Hunter Outfit, áreas profundas da Demon Forge e Blessing of the Inquisition"
    reward: "Demon Hunter Outfit and addons, access to the deeper Demon Forge areas, ability to buy the Blessing of the Inquisition, 3 achievements (High Inquisitor, Master of the Nexus and Demonbane), and your choice of one of the following: Emerald Sword, Hellforged Axe, Obsidian Truncheon, Warsinger Bow…"
    location: Thais
    region: Thais

