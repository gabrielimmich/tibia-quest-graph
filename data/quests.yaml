# Fonte única da verdade do grafo. Ver CLAUDE.md, seção 4.
#
# Regra de ouro: nenhuma aresta entra sem `evidence` copiada literalmente da
# página da TibiaWiki (texto como aparece renderizado), e `source` é a URL de
# onde o trecho foi copiado. `npm run validate` recusa placeholder, id
# inexistente, ciclo e campo desconhecido.
#
# Direção: `from` é a quest exigida, `to` é a quest que exige.
# Comentários "fase 2" registram pré-requisitos citados pela wiki que apontam
# para quests fora das 15 do MVP; viram arestas quando essas quests entrarem.
#
# Coletado em 2026-09-12 da API MediaWiki (tibia.fandom.com), aprovado por Gabriel.

