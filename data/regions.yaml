# Região → lugares. O coletor compara o campo `location` da quest (primeiro
# lugar citado no infobox) com esta lista, sem caixa nem acento, aceitando o
# lugar como substring ("Thais Ancient Temple" → Thais). Lugar sem região
# vira "Outros"; a lista dos não mapeados sai em docs/superpowers/review/.
#
# Rascunho inicial veio do campo `city` das páginas de lugar da wiki
# (`npm run draft-regions`); o resto é curadoria e pode estar errado. Corrija
# à vontade: o próximo `npm run collect` não muda quests já existentes, então
# para reaplicar uma região edite o `region` da quest ou apague-o antes.

