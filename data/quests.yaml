edges:
  # --- Zao ---
  - from: the-new-frontier
    to: children-of-the-revolution
    kind: required
    evidence: "The New Frontier Quest mission 8."
    source: https://tibia.fandom.com/wiki/Children_of_the_Revolution_Quest/Spoiler

  - from: the-new-frontier
    to: wrath-of-the-emperor
    kind: required
    evidence: "The New Frontier Quest (full quest not needed - received Mortal Kombat mission)"
    source: https://tibia.fandom.com/wiki/Wrath_of_the_Emperor_Quest/Spoiler

  - from: children-of-the-revolution
    to: wrath-of-the-emperor
    kind: required
    evidence: "Completed Children of the Revolution Quest (plus the Daily Task: Zzuppliezz)"
    source: https://tibia.fandom.com/wiki/Wrath_of_the_Emperor_Quest/Spoiler

  - from: the-new-frontier
    to: forgotten-knowledge
    kind: required
    evidence: "The New Frontier Quest completed including mission 9, Mortal Combat (for permission to use the Fire Portal);"
    source: https://tibia.fandom.com/wiki/Forgotten_Knowledge_Quest/Spoiler

  - from: the-new-frontier
    to: the-secret-library
    kind: recommended
    evidence: "Completed The New Frontier Quest (only necessary to be able to use the shortcut between Zao and the Falcon Bastion)."
    source: https://tibia.fandom.com/wiki/The_Secret_Library_Quest/Spoiler

  # --- Svargrond ---
  - from: barbarian-test
    to: the-ice-islands
    kind: required
    evidence: "Succeed the Barbarian Test Quest, and then head to Iskan to the north-east of Svargrond (here)."
    source: https://tibia.fandom.com/wiki/The_Ice_Islands_Quest/Spoiler

  - from: barbarian-test
    to: in-service-of-yalahar
    kind: required
    evidence: "Completed all 3 Barbarian Tests"
    source: https://tibia.fandom.com/wiki/In_Service_of_Yalahar_Quest/Spoiler

  - from: the-ice-islands
    to: in-service-of-yalahar
    kind: recommended
    evidence: "For missiong 5: Completed (or bring a friend who has completed) the first mission of Ice Islands Quest (Nibelor: Breaking the Ice)"
    source: https://tibia.fandom.com/wiki/In_Service_of_Yalahar_Quest/Spoiler

  - from: the-ice-islands
    to: forgotten-knowledge
    kind: required
    evidence: "The Ice Islands Quest completed up to the The Contactman mission (for access to the Formorgar Mines);"
    source: https://tibia.fandom.com/wiki/Forgotten_Knowledge_Quest/Spoiler

  # --- Dream Courts ---
  - from: the-ice-islands
    to: the-dream-courts
    kind: access
    evidence: "Access to Tyrsung and Okolnir (take the Nibelor 2: Ecological Terrorism from The Ice Islands Quest);"
    source: https://tibia.fandom.com/wiki/The_Dream_Courts_Quest/Spoiler

  - from: threatened-dreams
    to: the-dream-courts
    kind: access
    evidence: "Access to Feyrist (Complete the Threatened Dreams Quest - Troubled Animals);"
    source: https://tibia.fandom.com/wiki/The_Dream_Courts_Quest/Spoiler

  - from: forgotten-knowledge
    to: the-dream-courts
    kind: required
    evidence: "A Ghostsilver Lantern from the Forgotten Knowledge Quest;"
    source: https://tibia.fandom.com/wiki/The_Dream_Courts_Quest/Spoiler

  # --- Inquisition ---
  - from: the-pits-of-inferno
    to: the-inquisition
    kind: access
    evidence: "Finally, note that in order to access the Demon Forge and start Mission 7 you must have absorbed the spirit of at least one of The Ruthless Seven in The Pits of Inferno Quest."
    source: https://tibia.fandom.com/wiki/The_Inquisition_Quest/Spoiler

  # --- Zarganash ---
  - from: feaster-of-souls
    to: soul-war
    kind: required
    evidence: "Completed the Feaster of Souls Quest"
    source: https://tibia.fandom.com/wiki/Soul_War_Quest/Spoiler
